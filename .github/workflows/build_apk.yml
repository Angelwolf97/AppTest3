name: Build Kalshi Trainer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack and repair project files
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          sed -i 's|package="com.quant.kalshitrainer"||g' app/src/main/AndroidManifest.xml
          sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' app/src/main/AndroidManifest.xml
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"||g' app/src/main/AndroidManifest.xml
          sed -i 's|?attr/selectableItemBackground|@android:color/transparent|g' app/src/main/res/layout/layout_floating_hud.xml
          sed -i 's|LayoutInflater.from(this)|LayoutInflater.from(android.view.ContextThemeWrapper(this, R.style.Theme_KalshiTrainer))|g' app/src/main/java/com/quant/kalshitrainer/FloatingOverlayService.kt
          sed -i 's|gemini-1.5-flash|gemini-2.5-flash|g' app/src/main/java/com/quant/kalshitrainer/KalshiVisionTrainer.kt
          if ! grep -q "Dispatchers.Main" app/src/main/java/com/quant/kalshitrainer/KalshiVisionTrainer.kt; then
            sed -i 's|callback(result)|withContext(Dispatchers.Main) { callback(result) }|g' app/src/main/java/com/quant/kalshitrainer/KalshiVisionTrainer.kt
            sed -i 's|callback(null)|withContext(Dispatchers.Main) { callback(null) }|g' app/src/main/java/com/quant/kalshitrainer/KalshiVisionTrainer.kt
          fi
          if ! grep -q "registerCallback" app/src/main/java/com/quant/kalshitrainer/ScreenCaptureService.kt; then
            sed -i 's|startForeground(101, createNotification())||g' app/src/main/java/com/quant/kalshitrainer/ScreenCaptureService.kt
            sed -i 's|val mpm =|if (Build.VERSION.SDK_INT >= 29) startForeground(101, createNotification(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION) else startForeground(101, createNotification()); val mpm =|g' app/src/main/java/com/quant/kalshitrainer/ScreenCaptureService.kt
            sed -i 's|setupVirtualDisplay()|mediaProjection?.registerCallback(object : MediaProjection.Callback() {}, android.os.Handler(android.os.Looper.getMainLooper())); setupVirtualDisplay()|g' app/src/main/java/com/quant/kalshitrainer/ScreenCaptureService.kt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build APK with Gradle
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-screen-trainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
